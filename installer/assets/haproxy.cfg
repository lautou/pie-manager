global
    log stdout format raw local0 info
    maxconn 1000

defaults
    mode http
    log global
    timeout connect 5s
    timeout client 300s
    timeout server 300s
    option httplog
    option dontlognull
    option forwardfor
    option http-server-close

# Podman/Docker internal DNS resolver (always 127.0.0.11).
# HAProxy queries it periodically instead of freezing the resolved IP at startup.
# resolve-prefer ipv4 prevents HAProxy from hitting an IPv6 address that
# uvicorn does not listen on (uvicorn binds 0.0.0.0 = IPv4 only in rootless Podman).
resolvers docker_dns
    nameserver dns1 127.0.0.11:53
    resolve_retries 3
    timeout retry 1s
    timeout resolve 1s
    hold valid 10s

frontend pie_http
    bind *:8080

    acl is_api path_beg /api/
    use_backend pie_backend if is_api
    default_backend pie_frontend

backend pie_backend
    option httpchk
    http-check send meth GET uri /api/admin/health ver HTTP/1.1 hdr Host backend
    http-check expect status 200
    # init-addr libc,none: allows HAProxy to start even if backend is not yet up.
    server backend backend:8000 check inter 2s rise 2 fall 3 resolvers docker_dns resolve-prefer ipv4 init-addr libc,none

backend pie_frontend
    timeout tunnel 3600s
    server frontend frontend:5173 resolvers docker_dns resolve-prefer ipv4 init-addr libc,none
