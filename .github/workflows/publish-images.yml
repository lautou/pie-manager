name: Publish Container Images
on:
  push:
    tags: ['v*.*.*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Log in to quay.io
        run: echo "${{ secrets.QUAY_TOKEN }}" | podman login quay.io -u "${{ secrets.QUAY_ROBOT }}" --password-stdin

      # Build -> scan -> push, in that order, for both images: a Trivy failure below must
      # stop the push, not just the workflow run after the fact. Scanning after push (the
      # previous layout) let an image with a real fixable HIGH/CRITICAL CVE reach Quay.io
      # before the scan result was even known - failing the job at that point couldn't undo
      # the publish, and compose-prod.yaml always pins the exact version tag (never
      # `:latest`), so gating only `:latest` would have protected nothing real either (see
      # #21). Trivy scans a local `podman save` tarball via `input:`, not `image-ref:`
      # against the registry - `input:` is the one local-scan path Trivy's own docs actually
      # document (registry vs. local Docker-daemon auto-detection for `image-ref:` is
      # undocumented for Podman specifically), so this avoids relying on unconfirmed behavior.
      - name: Build backend
        run: |
          podman build -t quay.io/ltourreau/pie-manager-backend:$VERSION -f ./backend/Containerfile ./backend
          podman tag quay.io/ltourreau/pie-manager-backend:$VERSION quay.io/ltourreau/pie-manager-backend:latest
        env:
          VERSION: ${{ steps.version.outputs.version }}

      - name: Save backend image for local scanning
        run: podman save -o backend-image.tar quay.io/ltourreau/pie-manager-backend:${{ steps.version.outputs.version }}

      - name: Scan backend image (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          input: backend-image.tar
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1

      - name: Push backend
        run: |
          podman push quay.io/ltourreau/pie-manager-backend:$VERSION
          podman push quay.io/ltourreau/pie-manager-backend:latest
        env:
          VERSION: ${{ steps.version.outputs.version }}

      - name: Build frontend
        run: |
          podman build -t quay.io/ltourreau/pie-manager-frontend:$VERSION -f ./frontend/Containerfile ./frontend
          podman tag quay.io/ltourreau/pie-manager-frontend:$VERSION quay.io/ltourreau/pie-manager-frontend:latest
        env:
          VERSION: ${{ steps.version.outputs.version }}

      - name: Save frontend image for local scanning
        run: podman save -o frontend-image.tar quay.io/ltourreau/pie-manager-frontend:${{ steps.version.outputs.version }}

      - name: Scan frontend image (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          input: frontend-image.tar
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1

      - name: Push frontend
        run: |
          podman push quay.io/ltourreau/pie-manager-frontend:$VERSION
          podman push quay.io/ltourreau/pie-manager-frontend:latest
        env:
          VERSION: ${{ steps.version.outputs.version }}

  # Real backup/restore round-trip against the just-published backend image — #20's
  # multi-stage build hand-copies pg_dump/pg_restore's shared-library closure instead of
  # apt-installing postgresql-client, and the Containerfile's own build-time check only
  # proves the binaries *start* (`--version`), not that a full round-trip against a real
  # database still works. continue-on-error until proven reliable across a few releases,
  # mirroring test-windows-install/test-linux-install in build-installer.yml (see #45).
  smoke-test-backend:
    needs: publish
    runs-on: ubuntu-latest
    continue-on-error: true
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pie
          POSTGRES_PASSWORD: pie_password
          POSTGRES_DB: pie_db
        options: >-
          --health-cmd "pg_isready -U pie -d pie_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

    steps:
      - name: Run backend image
        run: |
          podman run -d --name backend-smoke --network host \
            -e DATABASE_URL="postgresql+asyncpg://pie:pie_password@localhost:5432/pie_db" \
            -e PYTHONPATH=/app \
            "quay.io/ltourreau/pie-manager-backend:${{ needs.publish.outputs.version }}" \
            sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

      - name: Wait for backend health
        run: |
          deadline=$((SECONDS + 120))
          until curl -sf http://localhost:8000/api/admin/health >/dev/null 2>&1; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::Backend never became healthy"
              podman logs backend-smoke
              exit 1
            fi
            sleep 2
          done

      - name: Seed minimal data
        run: |
          curl -sf -X POST http://localhost:8000/api/portfolios/ \
            -H "Content-Type: application/json" \
            -d '{"name":"SmokeTest"}'

      - name: Download backup
        run: |
          curl -sf http://localhost:8000/api/admin/backup -o /tmp/smoke.dump
          test -s /tmp/smoke.dump

      - name: Restore backup
        run: |
          curl -sf -X POST http://localhost:8000/api/admin/restore \
            -F "file=@/tmp/smoke.dump"

      - name: Verify data survived the round-trip
        run: |
          curl -sf http://localhost:8000/api/portfolios/ | grep -q "SmokeTest"

      - name: Dump backend logs on failure
        if: failure()
        run: podman logs backend-smoke || true

      - name: Clean up
        if: always()
        run: podman rm -f backend-smoke || true
