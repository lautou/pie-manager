server {
    listen 80;

    # API requests → FastAPI backend
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;   # allow time for pg_dump backup
        proxy_send_timeout 300s;
        proxy_buffering off;       # stream large responses (backup, snapshots)
    }

    # Everything else → Vite dev server (with WebSocket support for HMR)
    location / {
        proxy_pass http://frontend:5173;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
