[pytest]
asyncio_mode = auto
testpaths = tests
# Coverage for unit tests (no DB required). Run with:
#   pytest tests/test_rebalancing_service.py tests/test_price_sync.py --cov=app/services --cov=app/tasks/prices --cov-fail-under=80
# Full coverage including integration tests runs in CI with a real PostgreSQL.
addopts = --tb=short
filterwarnings =
    # Python 3.14 GC can finalize AsyncMock internal coroutines after test teardown.
    # This is a known mock.py limitation in Python 3.14, not a bug in our code.
    ignore::pytest.PytestUnraisableExceptionWarning
    ignore:coroutine 'AsyncMockMixin._execute_mock_call' was never awaited:RuntimeWarning
    # FastAPI/Starlette use asyncio.iscoroutinefunction which is deprecated in Python 3.14+.
    ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning
    ignore:asyncio.iscoroutinefunction:DeprecationWarning
