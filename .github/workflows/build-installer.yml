name: Build Installer
on:
  push:
    tags: ['v*.*.*']

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-go@v6.4.0
        with:
          go-version: '1.22'
          cache-dependency-path: installer/go.sum

      - name: Copy assets for embed
        run: |
          mkdir -p installer/assets
          cp compose-prod.yaml installer/assets/
          cp packaging/pie-manager.desktop installer/assets/
          cp packaging/pie-manager.svg installer/assets/
          # haproxy.cfg, wrapper.py, pie-manager.ico are version-controlled in installer/assets/

      - name: go mod tidy
        run: cd installer && go mod tidy

      - name: go vet (Linux)
        run: cd installer && go vet ./...

      - name: go vet (Windows)
        run: cd installer && GOOS=windows GOARCH=amd64 go vet ./...

      - name: go test (Linux — pure utility functions)
        run: cd installer && go test ./...

      - name: Build static binaries
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cd installer

          # Linux installer
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
            -ldflags="-s -w -X main.Version=${VERSION}" \
            -o "pie-manager-linux-amd64-${VERSION}" .

          # Windows installer (prereq + containers)
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build \
            -ldflags="-s -w -X main.Version=${VERSION}" \
            -o "pie-manager-windows-amd64-${VERSION}.exe" .

          # Generic aliases
          cp "pie-manager-linux-amd64-${VERSION}" pie-manager-linux-amd64
          cp "pie-manager-windows-amd64-${VERSION}.exe" pie-manager-windows-amd64.exe

      - name: Smoke test — Linux binary executes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          chmod +x "installer/pie-manager-linux-amd64-${VERSION}"
          output=$("./installer/pie-manager-linux-amd64-${VERSION}" version)
          echo "Version: $output"
          [ "$output" = "${VERSION}" ] || (echo "ERROR: expected ${VERSION}, got $output" && exit 1)

      - name: Create GitHub Release and upload binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME}"
          VER="${GITHUB_REF_NAME#v}"
          NOTES="## PIE Manager ${VERSION}

          ### Linux installation (x86_64)
          \`\`\`bash
          curl -LO https://github.com/${{ github.repository }}/releases/latest/download/pie-manager-linux-amd64
          chmod +x pie-manager-linux-amd64
          ./pie-manager-linux-amd64
          \`\`\`

          ### Windows 11 installation (x86_64)
          Download \`pie-manager-windows-amd64-${VER}.exe\` and run it as Administrator.
          Sets up WSL2, Podman, Docker Compose, and starts all containers automatically.

          ### Update
          Re-download and run again — fully idempotent."

          gh release create "${VERSION}" \
            --repo ${{ github.repository }} \
            --title "PIE Manager ${VERSION}" \
            --notes "${NOTES}" \
            2>/dev/null || true

          gh release upload "${VERSION}" \
            "installer/pie-manager-linux-amd64-${VER}" \
            "installer/pie-manager-windows-amd64-${VER}.exe" \
            installer/pie-manager-linux-amd64 \
            installer/pie-manager-windows-amd64.exe \
            --repo ${{ github.repository }} \
            --clobber

      - name: Delete obsolete releases (keep only the latest)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CURRENT="${{ github.ref_name }}"
          gh release list --repo ${{ github.repository }} --limit 50 --json tagName \
            --jq '.[].tagName' | grep -v "^${CURRENT}$" | while read tag; do
            gh release delete "$tag" --repo ${{ github.repository }} --yes 2>/dev/null || true
          done
