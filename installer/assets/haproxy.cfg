global
    log stdout format raw local0 info
    maxconn 1000

defaults
    mode http
    log global
    timeout connect 5s
    timeout client 300s
    timeout server 300s
    option httplog
    option dontlognull
    option forwardfor
    option http-server-close

frontend pie_http
    bind *:8080

    acl is_api path_beg /api/
    use_backend pie_backend if is_api
    default_backend pie_frontend

# Active health check using HAProxy 3.x syntax (option httpchk is deprecated since 2.4).
# http-check connect establishes TCP; http-check send probes /api/admin/health.
# HAProxy only routes traffic once the backend passes rise 2 consecutive checks.
backend pie_backend
    http-check connect
    http-check send meth GET uri /api/admin/health
    http-check expect status 200
    server backend backend:8000 check inter 2s rise 2 fall 3

backend pie_frontend
    # tunnel timeout keeps WebSocket connections (Vite HMR) alive
    timeout tunnel 3600s
    server frontend frontend:5173 check inter 5s rise 2 fall 3
