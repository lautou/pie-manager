name: Build Installer
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

jobs:
  detect-installer-changes:
    # Full install-flow testing (below) is expensive relative to a routine
    # backend/frontend release — it only needs to re-run when the installer's
    # own risk surface actually moved. Compares against the previous release
    # tag; no previous tag (first-ever release) is treated as "changed" (safe
    # default — run the full tests rather than silently skip them).
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Check if installer-relevant paths changed since the previous release
        id: diff
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}~1" 2>/dev/null || echo "")
          PATHS="installer/ packaging/ compose-prod.yaml .github/workflows/build-installer.yml .github/workflows/ci.yml"
          if [ -z "$PREV_TAG" ]; then
            echo "No previous release tag found — treating as changed."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$PREV_TAG"..HEAD -- $PATHS; then
            echo "No installer-relevant changes since $PREV_TAG — full install tests will be skipped."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Installer-relevant changes found since $PREV_TAG."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # git-cliff (changelog generation below) needs the full commit
          # history and all tags to compute the range since the previous
          # release — a shallow checkout gets empty/wrong changelogs.
          fetch-depth: 0

      - name: Determine version
        # On a tag push, VERSION is the real release version. On a manual
        # workflow_dispatch run (used to test the full install flow — incl.
        # real Apple Silicon hardware — without creating a release, see
        # CLAUDE.md), there's no tag to derive a version from — and no
        # made-up dev version has a matching image on Quay.io, since images
        # are only ever pushed by publish-images.yml at real release time.
        # Confirmed live: a fake "0.0.0-dispatch-<sha>" version made every
        # install job fail on "podman pull ... manifest unknown". Reuse the
        # latest already-published release's version instead, so the
        # install-flow test pulls real, existing images. Exported once via
        # GITHUB_OUTPUT so every downstream job reads the same value instead
        # of re-deriving it.
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            LATEST_TAG=$(gh release view --json tagName -q .tagName --repo "${{ github.repository }}")
            if [ -z "$LATEST_TAG" ]; then
              echo "::error::No published release found — workflow_dispatch install testing needs at least one existing release to pull images from."
              exit 1
            fi
            VERSION="${LATEST_TAG#v}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.22'
          cache-dependency-path: installer/go.sum

      - name: Copy assets for embed
        run: |
          mkdir -p installer/assets
          cp compose-prod.yaml installer/assets/
          cp packaging/pie-manager.desktop installer/assets/
          cp packaging/pie-manager.svg installer/assets/
          cp packaging/pie-manager-macos-info.plist installer/assets/
          # haproxy.cfg, pie-manager.ico are version-controlled in installer/assets/

      - name: go mod tidy
        run: cd installer && go mod tidy

      - name: go vet (Linux)
        run: cd installer && go vet ./...

      - name: go vet (macOS)
        run: cd installer && GOOS=darwin GOARCH=arm64 go vet ./...

      - name: go test (Linux — pure utility functions)
        run: cd installer && go test ./...

      - name: Build static binaries
        run: |
          cd installer

          # The three builds are independent (different GOOS/GOARCH, different
          # output files) — Go's build/module cache is safe for concurrent
          # access, so run them in parallel rather than one after another.
          #
          # Each build's own output (including any compiler error) is captured
          # to its own log file instead of interleaving on stdout — with 3
          # concurrent processes, interleaved output is genuinely hard to read.
          # Every `wait` is checked explicitly (not left to `set -e` on the
          # first one) so that if two builds break at once, this run reports
          # BOTH failures instead of hiding the second behind the first.

          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
            -ldflags="-s -w -X main.Version=${VERSION}" \
            -o "pie-manager-linux-amd64-${VERSION}" . >/tmp/build-linux.log 2>&1 &
          pid_linux=$!

          # macOS installer (Apple Silicon only — see CLAUDE.md's "macOS installation
          # architecture" section for why amd64/Intel isn't built)
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build \
            -ldflags="-s -w -X main.Version=${VERSION}" \
            -o "pie-manager-darwin-arm64-${VERSION}" . >/tmp/build-darwin.log 2>&1 &
          pid_darwin=$!

          fail=0
          for entry in "$pid_linux:Linux:linux" "$pid_darwin:macOS:darwin"; do
            pid="${entry%%:*}"; rest="${entry#*:}"; label="${rest%%:*}"; logname="${rest#*:}"
            if ! wait "$pid"; then
              echo "::error::${label} installer build failed"
              cat "/tmp/build-${logname}.log"
              fail=1
            fi
          done
          [ "$fail" -eq 0 ]

          # Generic aliases
          cp "pie-manager-linux-amd64-${VERSION}" pie-manager-linux-amd64
          cp "pie-manager-darwin-arm64-${VERSION}" pie-manager-darwin-arm64

      - name: Smoke test — Linux binary executes
        run: |
          chmod +x "installer/pie-manager-linux-amd64-${VERSION}"
          output=$("./installer/pie-manager-linux-amd64-${VERSION}" version)
          echo "Version: $output"
          [ "$output" = "${VERSION}" ] || (echo "ERROR: expected ${VERSION}, got $output" && exit 1)

      - name: Upload binaries for real-hardware install testing
        uses: actions/upload-artifact@v7.0.1
        with:
          name: pie-manager-darwin-arm64
          path: installer/pie-manager-darwin-arm64-*
          retention-days: 1

      - name: Upload Linux binary for real-install testing
        uses: actions/upload-artifact@v7.0.1
        with:
          name: pie-manager-linux-amd64
          path: installer/pie-manager-linux-amd64-*
          retention-days: 1

      - name: Generate CHANGELOG.md
        # v1.0.1-v1.0.20 don't exist as tags anymore (deleted during early
        # iteration, before this changelog existed) — cliff.toml's static
        # header already covers the initial release through v1.0.21 as one
        # combined entry, so generation is restricted to start right after
        # it. Every tag from v1.0.22 onward gets an accurate, individually
        # generated entry. See CLAUDE.md and issue #15.
        if: github.event_name == 'push'
        uses: orhun/git-cliff-action@v4.8.0
        with:
          config: cliff.toml
          args: v1.0.21..
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract this release's changelog entry for the release notes
        if: github.event_name == 'push'
        uses: orhun/git-cliff-action@v4.8.0
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: /tmp/latest-changelog.md
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release and upload binaries
        # Never runs on a manual workflow_dispatch test run — only a real tag
        # push should ever create/publish a GitHub release.
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          VER="${VERSION}"
          NOTES="## PIE Manager ${TAG}

          ### Linux installation (x86_64)
          \`\`\`bash
          curl -LO https://github.com/${{ github.repository }}/releases/latest/download/pie-manager-linux-amd64
          chmod +x pie-manager-linux-amd64
          ./pie-manager-linux-amd64
          \`\`\`

          ### Windows 11 installation (x86_64)
          Install from the Microsoft Store: https://apps.microsoft.com/detail/9PM8GPSMJG0N
          No prerequisites — the Store app bundles its own backend and PostgreSQL directly.
          No WSL2, no Podman, no containers to download.

          ### macOS installation (Apple Silicon)
          \`\`\`bash
          curl -LO https://github.com/${{ github.repository }}/releases/latest/download/pie-manager-darwin-arm64
          chmod +x pie-manager-darwin-arm64
          xattr -d com.apple.quarantine pie-manager-darwin-arm64
          ./pie-manager-darwin-arm64
          \`\`\`
          The binary is unsigned (no Apple Developer certificate) — the \`xattr\` step above is
          required once, or Gatekeeper will refuse to run it. Requires macOS 14 Sonoma or later.

          ### Update
          Re-download and run again — fully idempotent.

          ### Changelog

          $(cat /tmp/latest-changelog.md 2>/dev/null || echo '_No changelog available._')"

          gh release create "${TAG}" \
            --repo ${{ github.repository }} \
            --title "PIE Manager ${TAG}" \
            --notes "${NOTES}" \
            2>/dev/null || true

          gh release upload "${TAG}" \
            "installer/pie-manager-linux-amd64-${VER}" \
            "installer/pie-manager-darwin-arm64-${VER}" \
            installer/pie-manager-linux-amd64 \
            installer/pie-manager-darwin-arm64 \
            --repo ${{ github.repository }} \
            --clobber

      - name: Commit CHANGELOG.md to main
        # Committed on top of this job's detached-HEAD checkout (the tag
        # commit) and pushed straight to main. The tag and main's tip are
        # normally the same commit at release time, so this push is a plain
        # fast-forward. The tag itself is never amended — like every other
        # changelog-bot tool, the tagged tree never includes its own
        # changelog entry, only main does going forward.
        #
        # Deliberately placed after the release is created and its binaries
        # uploaded, and never fails the job on error (e.g. someone pushed to
        # main between the tag and this workflow running, breaking the
        # fast-forward): the changelog is documentation, not the release
        # itself, so a push failure here must never take down the actual
        # release/binaries above it.
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- CHANGELOG.md; then
            echo "CHANGELOG.md unchanged, nothing to commit."
          else
            git add CHANGELOG.md
            git commit -m "chore(changelog): update CHANGELOG.md for ${GITHUB_REF_NAME}"
            git push origin HEAD:main || echo "::warning::Failed to push CHANGELOG.md to main — release itself is unaffected."
          fi

      - name: Delete obsolete releases (keep only the latest)
        # Never runs on a manual workflow_dispatch test run — deleting real
        # releases must only ever happen as part of an actual tag-push release.
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CURRENT="${{ github.ref_name }}"
          gh release list --repo ${{ github.repository }} --limit 50 --json tagName \
            --jq '.[].tagName' | grep -v "^${CURRENT}$" | while read tag; do
            gh release delete "$tag" --repo ${{ github.repository }} --yes 2>/dev/null || true
          done

  package-native-launcher-msix:
    # Builds the real, Store-identity MSIX package of the native Windows port (issue #82) as a
    # durable release asset. Mirrors package-launcher-msix's versioning/signing/release-upload
    # pattern from PR #64 (issue #63's rejected launcher.exe-only approach) — but needs the full
    # bundling (Postgres, embeddable Python, real backend, real frontend) that a launcher.exe-
    # alone package never did; that bundling mechanism was proven live via
    # installer/testing/native-launcher-poc before being promoted here (see CLAUDE.md).
    #
    # Also submits the built package to the Microsoft Store (see the "Publish to the Microsoft
    # Store" step below) — the app is live on the Store since #82's certification passed on
    # v1.4.8, and submission itself is automated via the Microsoft Store Developer CLI, not a
    # manual Partner Center upload. Runs on every release, not gated behind
    # detect-installer-changes, matching package-launcher-msix's own reasoning: cheap, and keeps
    # a submittable package available at every version.
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.22'

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'

      - name: Build the real frontend and stage it into the package
        working-directory: frontend
        shell: pwsh
        run: |
          npm ci
          npm run build
          Copy-Item -Recurse dist ..\installer\launcher-native\frontend_dist

      - name: Build launcher-native.exe and render the real brand icon into MSIX logo assets
        working-directory: installer/launcher-native
        shell: pwsh
        run: |
          $version = "${{ needs.build.outputs.version }}"
          go mod tidy
          $env:CGO_ENABLED = "0"
          $env:GOOS = "windows"
          $env:GOARCH = "amd64"
          go build -ldflags "-H windowsgui -s -w -X main.Version=$version" -o launcher-native.exe .
          New-Item -ItemType Directory -Force -Path Assets | Out-Null
          go run ./gen-assets 256x256.png Assets

      - name: Download and stage the portable PostgreSQL distribution
        # bin+share+lib must all be staged together with their relative layout preserved —
        # pg_ctl/initdb/postgres.exe locate their own share/lib dependencies relative to their
        # own location, confirmed via #76/#82's earlier proof-of-work poc iterations.
        working-directory: installer/launcher-native
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $url = "https://get.enterprisedb.com/postgresql/postgresql-16.14-1-windows-x64-binaries.zip"
          Invoke-WebRequest -Uri $url -OutFile pg.zip
          Expand-Archive -Path pg.zip -DestinationPath pg_extracted -Force
          New-Item -ItemType Directory -Force -Path pgsql | Out-Null
          Move-Item -Path pg_extracted\pgsql\bin -Destination pgsql\bin
          Move-Item -Path pg_extracted\pgsql\share -Destination pgsql\share
          Move-Item -Path pg_extracted\pgsql\lib -Destination pgsql\lib
          # The selective move above drops these two license files that live at the zip's
          # pgsql/ root (covering exactly the CLI tools bundled here) — copy them along too,
          # so the license terms for postgres.exe/pg_ctl.exe/initdb.exe/createdb.exe actually
          # ship with the binaries they cover, for a Store reviewer or anyone else looking.
          Copy-Item pg_extracted\pgsql\server_license.txt pgsql\server_license.txt
          Copy-Item pg_extracted\pgsql\commandlinetools_3rd_party_licenses.txt pgsql\commandlinetools_3rd_party_licenses.txt
          Remove-Item -Recurse -Force pg_extracted, pg.zip

      - name: Bundle the VC++ Redistributable app-local (no system-wide install needed)
        # Store-distributable apps can't run an elevated external installer at activation, so
        # the runtime DLLs are copied in app-local instead — same rationale as #76/#82's pocs.
        working-directory: installer/launcher-native
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vc_redist.x64.exe" -OutFile vc_redist.x64.exe
          Start-Process -FilePath .\vc_redist.x64.exe -ArgumentList "/install","/quiet","/norestart" -Wait
          Copy-Item C:\Windows\System32\vcruntime140.dll pgsql\bin\vcruntime140.dll
          Copy-Item C:\Windows\System32\vcruntime140_1.dll pgsql\bin\vcruntime140_1.dll
          Copy-Item C:\Windows\System32\msvcp140.dll pgsql\bin\msvcp140.dll
          Remove-Item vc_redist.x64.exe

      - name: Bundle an embeddable Python + the real backend (source + requirements.txt)
        working-directory: installer/launcher-native
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -Uri "https://www.python.org/ftp/python/3.14.0/python-3.14.0-embed-amd64.zip" -OutFile python-embed.zip
          Expand-Archive -Path python-embed.zip -DestinationPath python -Force
          Remove-Item python-embed.zip

          $pthFile = Get-ChildItem python\python*._pth | Select-Object -First 1
          (Get-Content $pthFile.FullName) -replace '#import site', 'import site' | Set-Content $pthFile.FullName

          Invoke-WebRequest -Uri "https://bootstrap.pypa.io/get-pip.py" -OutFile get-pip.py
          & python\python.exe get-pip.py --no-warn-script-location
          Remove-Item get-pip.py

          & python\python.exe -m pip install --no-warn-script-location -r ..\..\backend\requirements.txt
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::pip install failed with exit code $LASTEXITCODE"
            exit 1
          }

          Copy-Item -Recurse ..\..\backend\app python\app
          Copy-Item ..\..\backend\alembic.ini python\alembic.ini
          Copy-Item -Recurse ..\..\backend\alembic python\alembic
          Get-ChildItem -Path python\app, python\alembic -Recurse -Directory -Filter "__pycache__" -ErrorAction SilentlyContinue |
            Remove-Item -Recurse -Force

      - name: Stage manifest with the real version
        # A real tag push gets a stable X.Y.Z.0 -- this is the actual Store submission
        # identity and must not vary run-to-run. A manual workflow_dispatch test build reuses
        # the same X.Y.Z (see the "Determine version" step above) on every run, so it needs a
        # distinct revision component per run instead, or Windows treats the reinstall as
        # "already have this version" and silently keeps serving the previously-installed
        # package's content -- confirmed live (issue #118), see AppxManifest.xml's own comment.
        working-directory: installer/launcher-native
        shell: pwsh
        run: |
          $version = "${{ needs.build.outputs.version }}"
          if ("${{ github.event_name }}" -eq "push") {
            $fullVersion = "$version.0"
          } else {
            $fullVersion = "$version.${{ github.run_number }}"
          }
          (Get-Content AppxManifest.xml) -replace '__VERSION__', $fullVersion | Set-Content AppxManifest.xml

      - name: Locate Windows SDK packaging/signing tools
        working-directory: installer/launcher-native
        shell: pwsh
        run: |
          $sdkRoot = "C:\Program Files (x86)\Windows Kits\10\bin"
          $sdkVer = Get-ChildItem $sdkRoot -Directory |
            Where-Object { $_.Name -match '^\d+\.\d+\.\d+\.\d+$' } |
            Sort-Object Name -Descending | Select-Object -First 1
          if (-not $sdkVer) {
            Write-Host "::error::No Windows 10 SDK bin directory found under $sdkRoot"
            exit 1
          }
          $makeappx = Join-Path $sdkVer.FullName "x64\makeappx.exe"
          $signtool = Join-Path $sdkVer.FullName "x64\signtool.exe"
          if (-not (Test-Path $makeappx)) {
            Write-Host "::error::makeappx.exe not found at $makeappx"
            exit 1
          }
          if (-not (Test-Path $signtool)) {
            Write-Host "::error::signtool.exe not found at $signtool"
            exit 1
          }
          Add-Content -Path $env:GITHUB_ENV -Value "MAKEAPPX=$makeappx"
          Add-Content -Path $env:GITHUB_ENV -Value "SIGNTOOL=$signtool"

      - name: Generate ephemeral signing cert matching the real Store Publisher CN, and trust it
        # Per Microsoft's own docs, a Store submission's original signature never needs to
        # chain to a trusted root — Microsoft re-signs the package at publish time. This cert
        # only needs to make the package internally valid for makeappx/signtool/Add-AppxPackage
        # below, and its Subject must exactly match AppxManifest.xml's Identity/Publisher.
        # Trusted into LocalMachine so the install+launch test below can sideload it; discarded
        # at the end of this job regardless of outcome. Generated before packaging (not right
        # before the MSIX sign step) so the same cert can also sign the bundled PostgreSQL
        # executables below, while they're still loose files, not yet inside the package.
        working-directory: installer/launcher-native
        shell: pwsh
        run: |
          $version = "${{ needs.build.outputs.version }}"
          $cert = New-SelfSignedCertificate -Type Custom -Subject "CN=2654AE3A-D473-41CE-8C17-0C2734C3B4A3" `
            -KeyUsage DigitalSignature -FriendlyName "PieManagerNativeLauncherPackaging" `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")
          $thumbprint = $cert.Thumbprint
          Add-Content -Path $env:GITHUB_ENV -Value "THUMBPRINT=$thumbprint"

          # Named after the version (not a bare "cert.cer") so it survives being published
          # alongside the MSIX on the GitHub release as its own downloadable asset (see the
          # "Attach cert to the GitHub release" step below) — a sideloading user must fetch the
          # exact .cer matching the .msix version they're installing, since a fresh cert is
          # generated on every single build and never reused across releases.
          $certFile = "pie-manager-native-launcher-$version.cer"
          Add-Content -Path $env:GITHUB_ENV -Value "CERT_FILE=$certFile"
          Export-Certificate -Cert $cert -FilePath $certFile | Out-Null
          Import-Certificate -FilePath $certFile -CertStoreLocation "Cert:\LocalMachine\TrustedPeople" | Out-Null
          Import-Certificate -FilePath $certFile -CertStoreLocation "Cert:\LocalMachine\Root" | Out-Null

      - name: Sign the bundled PostgreSQL executables
        # EDB's official Windows zip ships these four completely unsigned (confirmed by
        # inspecting their PE Security Directory directly, not assumed) — an unsigned database
        # server binary that opens network listeners, sitting inside a Store submission, is a
        # real Defender/SmartScreen reputation weak point on end-user machines, independent of
        # whether Store certification itself passes (only the outer MSIX needs a signature for
        # that). Self-signing a third-party redistributable like this is legitimate and gives
        # Defender's heuristics a real signature to build trust against, even unchained to a
        # public CA — same reasoning that already applies to the outer MSIX signature above.
        working-directory: installer/launcher-native
        shell: pwsh
        run: |
          & $env:SIGNTOOL sign /fd SHA256 /sha1 $env:THUMBPRINT `
            pgsql\bin\postgres.exe pgsql\bin\pg_ctl.exe pgsql\bin\initdb.exe pgsql\bin\createdb.exe
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::signtool sign failed on the bundled PostgreSQL executables with exit code $LASTEXITCODE"
            exit 1
          }

      - name: Package MSIX
        working-directory: installer/launcher-native
        shell: pwsh
        run: |
          $version = "${{ needs.build.outputs.version }}"
          & $env:MAKEAPPX pack /d . /p "pie-manager-native-launcher-$version.msix" /o
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::makeappx pack failed with exit code $LASTEXITCODE"
            exit 1
          }

      - name: Sign the MSIX package
        working-directory: installer/launcher-native
        shell: pwsh
        run: |
          $version = "${{ needs.build.outputs.version }}"
          & $env:SIGNTOOL sign /fd SHA256 /sha1 $env:THUMBPRINT "pie-manager-native-launcher-$version.msix"
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::signtool sign failed with exit code $LASTEXITCODE"
            exit 1
          }

      - name: Install the package (sanity check)
        # Verifies the MSIX actually installs cleanly via Add-AppxPackage — reliably green
        # across every attempt in this job's history. Deliberately does NOT try to launch or
        # health-check the app: issue #116 documents an extensive investigation (elevated
        # runner token, a genuinely non-admin test user + granted logon rights, PsExec for real
        # desktop access, bypassing shell:AppsFolder to launch the packaged exe directly) that
        # traced this to a real, structural Windows security boundary, not a soft configuration
        # gap — C:\Program Files\WindowsApps\ is owned by TrustedInstaller with ACLs that deny
        # direct execution to anything but the OS's own activation broker ("Access is denied",
        # confirmed live), and that broker itself depends on interactive-session infrastructure
        # (the AppInfo service, RuntimeBroker, per-session COM launch permissions) that no
        # programmatically-created CI session can provide. This is not fixable by further CI
        # scripting — a genuine "does the app actually launch and become healthy" test needs a
        # real interactive Windows session (e.g. the win11 libvirt VM used elsewhere in this
        # project for exactly this kind of verification), not this runner.
        working-directory: installer/launcher-native
        shell: pwsh
        run: |
          $version = "${{ needs.build.outputs.version }}"
          Add-AppxPackage -Path "pie-manager-native-launcher-$version.msix" -Verbose

      - name: Uninstall test package and clean up trust store
        if: always()
        shell: pwsh
        run: |
          $pkg = Get-AppxPackage -Name "PIEManager.PIEManager"
          if ($pkg) {
            Remove-AppxPackage -Package $pkg.PackageFullName -ErrorAction SilentlyContinue
          }
          if ($env:THUMBPRINT) {
            Remove-Item "Cert:\LocalMachine\Root\$env:THUMBPRINT" -ErrorAction SilentlyContinue
            Remove-Item "Cert:\LocalMachine\TrustedPeople\$env:THUMBPRINT" -ErrorAction SilentlyContinue
            Remove-Item "Cert:\CurrentUser\My\$env:THUMBPRINT" -ErrorAction SilentlyContinue
          }

      - name: Upload MSIX and certificate as a workflow artifact
        # Kept even on failure (unlike the release-attach step below) so a failed run's
        # package can still be downloaded and inspected/sideloaded manually for debugging.
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: pie-manager-native-launcher-msix
          path: |
            installer/launcher-native/pie-manager-native-launcher-*.msix
            installer/launcher-native/pie-manager-native-launcher-*.cer
          retention-days: 7

      - name: Attach MSIX and certificate to the GitHub release
        # The .cer is published alongside the .msix so a user sideloading directly from GitHub
        # (instead of the Store — see docs/INSTALLATION.md's "Alternative : installation
        # manuelle" section) can trust this exact build's self-signed certificate before running
        # Add-AppxPackage. Kept as a durable copy on the GitHub Release itself, independent of
        # the Store submission step below (that one can fail certification independently — see
        # #82's history — without losing the actual built package). Only reached if every step
        # above (including the live install+launch test) succeeded, and never runs on a manual
        # workflow_dispatch test run.
        if: github.event_name == 'push'
        working-directory: installer/launcher-native
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = "${{ needs.build.outputs.version }}"
          gh release upload "${{ github.ref_name }}" "pie-manager-native-launcher-$version.msix" "pie-manager-native-launcher-$version.cer" --repo "${{ github.repository }}" --clobber

      - name: Setup Microsoft Store Developer CLI
        # Automates the Partner Center submission that used to be a manual, whenever-the-
        # maintainer-is-ready step. Real Store ID: PIEManager.PIEManager_9h5hzpm8nc7w0
        # (9PM8GPSMJG0N), see CLAUDE.md. Only runs on a real tag push, never a manual
        # workflow_dispatch test build.
        if: github.event_name == 'push'
        uses: microsoft/microsoft-store-apppublisher@v1.1

      - name: Configure Microsoft Store Developer CLI
        # Credentials for the "PIE Manager CI Publisher" Entra ID app, registered in its own
        # dedicated organizational tenant (PIEMANAGER.onmicrosoft.com) and granted the Manager
        # role in Partner Center's Microsoft Entra applications tab — the personal-Microsoft-
        # account tenant this Partner Center account originally used cannot host app
        # registrations at all (Microsoft deprecated creating apps outside a real directory).
        if: github.event_name == 'push'
        run: |
          msstore reconfigure --tenantId ${{ secrets.AZURE_AD_TENANT_ID }} --sellerId ${{ secrets.SELLER_ID }} --clientId ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }} --clientSecret ${{ secrets.AZURE_AD_APPLICATION_SECRET }}

      - name: Publish to the Microsoft Store
        # Submits and commits the new package for certification (omitting --noCommit, unlike
        # a draft-only update) — this does not skip Microsoft's review, it only automates
        # what used to be a manual upload in Partner Center. A certification failure here
        # fails this job loudly rather than silently, matching the sanity-check install step
        # above; the GitHub release itself (previous step) is unaffected either way.
        #
        # --uploadTimeout is mandatory, not optional tuning: msstore-cli defaults it to 0 when
        # omitted (System.CommandLine never runs the option's parser for an absent flag), which
        # Azure.Storage.Blobs turns into an instant TaskCanceledException on every upload —
        # see https://github.com/microsoft/msstore-cli/issues/162.
        if: github.event_name == 'push'
        working-directory: installer/launcher-native
        shell: pwsh
        run: |
          $version = "${{ needs.build.outputs.version }}"
          msstore publish "pie-manager-native-launcher-$version.msix" -id 9PM8GPSMJG0N --uploadTimeout 600 -v

  test-macos:
    # Real Apple Silicon hardware — the only way to actually run this binary,
    # since arm64 macOS cannot be virtualized on the x86_64 host used elsewhere
    # in this project's testing (see CLAUDE.md's "macOS installation architecture").
    # Only runs at release time (tag push), never on every commit — this repo
    # is public, so standard runner minutes (Linux/Windows/macOS alike) are
    # free and uncapped regardless of OS multiplier, but a full install test
    # still takes real wall-clock time, so it's reserved for release time
    # rather than run on every push/PR.
    #
    # Deliberately smoke-test only — no full `install` run. GitHub's own docs
    # state nested virtualization is unsupported on GitHub-hosted macOS
    # runners, and Podman Machine's `podman machine start` needs exactly that
    # (krunkit/Hypervisor.framework). Confirmed live: "krunkit exited
    # unexpectedly with exit code 1" / "podman machine start: exit status
    # 125" every time. This is a permanent platform limitation, not a
    # reliability issue to iterate on — see CLAUDE.md's "Full install-flow CI
    # testing" section before re-attempting a full install here.
    needs: [build, detect-installer-changes]
    runs-on: macos-26
    steps:
      - name: Download macOS binary
        uses: actions/download-artifact@v8.0.1   # node24-native
        with:
          name: pie-manager-darwin-arm64

      - name: Smoke test — macOS binary executes on real Apple Silicon
        run: |
          VERSION="${{ needs.build.outputs.version }}"
          chmod +x "pie-manager-darwin-arm64-${VERSION}"
          output=$(./"pie-manager-darwin-arm64-${VERSION}" version)
          echo "Version: $output"
          [ "$output" = "${VERSION}" ] || (echo "ERROR: expected ${VERSION}, got $output" && exit 1)

  test-linux-install:
    # Full install-flow test on ubuntu-latest: chosen over a native Fedora
    # environment (GitHub has no Fedora-hosted runner, and Fedora-in-a-
    # container would need privileged nested-Podman setup for little real
    # benefit) — install.go/start.go have no Fedora-specific logic beyond the
    # "dnf install" error message text; the actual Podman/compose behavior
    # this test exercises is distro-agnostic. See CLAUDE.md.
    needs: [build, detect-installer-changes]
    if: needs.detect-installer-changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Download Linux binary
        uses: actions/download-artifact@v8.0.1   # node24-native
        with:
          name: pie-manager-linux-amd64

      - name: Install Podman
        run: |
          sudo apt-get update && sudo apt-get install -y podman
          # Without podman-compose, detectComposeCmd() falls back to the
          # "podman compose" subcommand — which itself auto-detects and
          # delegates to the Docker CLI compose plugin GitHub's ubuntu-latest
          # image ships alongside Podman, and that plugin can't reach a
          # Docker daemon (confirmed live: "Cannot connect to the Docker
          # daemon ... podman.sock"). A real end-user machine without Docker
          # pre-installed wouldn't hit this; install podman-compose here to
          # match what this project's own detection logic actually prefers.
          pip install podman-compose

      - name: Wait for images to be published to Quay.io
        # build-installer.yml and publish-images.yml both trigger off the same
        # tag push with no ordering between them (see issue #16) — the real
        # install below reaches its "pull the app images" step well before
        # publish-images.yml finishes pushing them. Poll the public Quay.io
        # API for both tags first instead of racing it.
        run: |
          VERSION="${{ needs.build.outputs.version }}"
          deadline=$((SECONDS + 600))
          for img in pie-manager-backend pie-manager-frontend; do
            echo "Waiting for quay.io/ltourreau/${img}:${VERSION} ..."
            until curl -sf "https://quay.io/api/v1/repository/ltourreau/${img}/tag/?specificTag=${VERSION}&onlyActiveTags=true" \
              | jq -e '.tags | length > 0' >/dev/null 2>&1; do
              if [ "$SECONDS" -ge "$deadline" ]; then
                echo "::error::Timed out waiting for quay.io/ltourreau/${img}:${VERSION} to be published"
                exit 1
              fi
              sleep 10
            done
            echo "Found quay.io/ltourreau/${img}:${VERSION}"
          done

      - name: Run real install
        run: |
          VERSION="${{ needs.build.outputs.version }}"
          chmod +x "pie-manager-linux-amd64-${VERSION}"
          ./"pie-manager-linux-amd64-${VERSION}" install

      - name: Verify the app is actually serving traffic
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:14943/api/admin/health; then
              echo "Health check passed"
              exit 0
            fi
            sleep 2
          done
          echo "::error::Linux install: health check never succeeded"
          exit 1

