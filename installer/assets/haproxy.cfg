global
    log stdout format raw local0 info
    maxconn 1000

defaults
    mode http
    log global
    timeout connect 5s
    timeout client 300s
    timeout server 300s
    option httplog
    option dontlognull
    option forwardfor
    option http-server-close

frontend pie_http
    bind *:80

    acl is_api path_beg /api/
    use_backend pie_backend if is_api
    default_backend pie_frontend

# Active health check: probes /api/admin/health every 2 s.
# HAProxy only routes traffic to backend once it responds 200.
# Recovers automatically when backend comes back — no restart needed.
backend pie_backend
    option httpchk
    http-check send meth GET uri /api/admin/health ver HTTP/1.1 hdr Host backend
    http-check expect status 200
    server backend backend:8000 check inter 2s rise 2 fall 3

backend pie_frontend
    # tunnel timeout keeps WebSocket connections (Vite HMR) alive
    timeout tunnel 3600s
    server frontend frontend:5173 check inter 5s rise 2 fall 3
