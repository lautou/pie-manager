[alembic]
script_location = alembic
prepend_sys_path = .
# URL is overridden at runtime by env.py using the DATABASE_URL environment variable.
# This value is never used — alembic.ini is only needed for script_location above.
sqlalchemy.url = postgresql+asyncpg://pie:pie_password@localhost:5432/pie_db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
