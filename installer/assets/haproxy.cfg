global
    log stdout format raw local0 info
    maxconn 1000

defaults
    mode http
    log global
    timeout connect 5s
    timeout client 300s
    timeout server 300s
    option httplog
    option dontlognull
    option forwardfor
    option http-server-close

frontend pie_http
    bind *:8080

    acl is_api path_beg /api/
    use_backend pie_backend if is_api
    default_backend pie_frontend

# TCP health check: HAProxy connects to port 8000 every 2s.
# Sufficient because uvicorn only starts listening after alembic migrations
# complete — so an open port guarantees the app is fully ready.
backend pie_backend
    server backend backend:8000 check inter 2s rise 2 fall 3

backend pie_frontend
    # tunnel timeout keeps WebSocket connections (Vite HMR) alive
    timeout tunnel 3600s
    server frontend frontend:5173 check inter 5s rise 2 fall 3
