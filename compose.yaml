services:
  postgres:
    image: docker.io/library/postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pie}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pie_password}
      POSTGRES_DB: ${POSTGRES_DB:-pie_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pie} -d ${POSTGRES_DB:-pie_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Containerfile
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      PYTHONPATH: /app
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app:z
    depends_on:
      - postgres
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  pgq-worker:
    build:
      context: ./backend
      dockerfile: Containerfile
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      PYTHONPATH: /app
    volumes:
      - ./backend:/app:z
    depends_on:
      - backend
    command: pgq run app.tasks.pgq_app:main

  frontend:
    build:
      context: ./frontend
      dockerfile: Containerfile
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app:z
      - frontend_node_modules:/app/node_modules
    environment:
      VITE_API_URL: http://localhost:8000
      VITE_BACKEND_URL: http://backend:8000
    depends_on:
      - backend
    command: node_modules/.bin/vite --host 0.0.0.0

volumes:
  postgres_data:
  frontend_node_modules:
