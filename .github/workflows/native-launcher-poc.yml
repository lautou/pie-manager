name: Native Launcher PoC (issue #82)
# One-off diagnostic, not part of the release pipeline. First real end-to-end packaging of
# installer/launcher-native's orchestration logic (not just a cross-compile check) — answers
# whether it actually initializes Postgres, applies migrations, and starts the real backend from
# inside a full-trust MSIX, on a real Windows 11 machine. See
# installer/testing/native-launcher-poc/README.md.
on:
  workflow_dispatch:
  push:
    branches:
      - 'feature/82-native-windows-mvp'
    paths:
      - 'installer/launcher-native/**'
      - 'installer/testing/native-launcher-poc/**'
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/native-launcher-poc.yml'

jobs:
  build-native-launcher-poc:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: installer/testing/native-launcher-poc
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.22'

      - uses: actions/setup-node@v6.4.0
        with:
          node-version: '24'

      - name: Build the real frontend (vite build) and stage it into the package
        # Matches ci.yml's own Node version. `npm run build` is `tsc && vite build`, output at
        # frontend/dist/ (absolute-path asset references, e.g. /assets/index-XXXX.js) - served
        # by the backend's new app/frontend.py mount_frontend via FRONTEND_DIST_DIR, staged by
        # installer/launcher-native's stageBundledFiles the same way pgsql/python are.
        run: |
          cd ..\..\..\frontend
          npm ci
          npm run build
          cd ..\installer\testing\native-launcher-poc
          Copy-Item -Recurse ..\..\..\frontend\dist frontend_dist

      - name: Build launcher-native.exe and render the real brand icon into MSIX logo assets
        # gen-assets renders installer/256x256.png (the same source already embedded in
        # launcher.exe/pie-manager.exe via winres, and used for the Linux .desktop icon) down
        # to the sizes AppxManifest.xml requires — real branding, not the earlier solid-color
        # placeholders (issue #82).
        run: |
          cd ..\..\launcher-native
          go mod tidy
          $env:CGO_ENABLED = "0"
          $env:GOOS = "windows"
          $env:GOARCH = "amd64"
          go build -ldflags "-H windowsgui" -o ..\testing\native-launcher-poc\launcher-native.exe .
          cd ..\testing\native-launcher-poc
          go mod tidy
          New-Item -ItemType Directory -Force -Path Assets | Out-Null
          go run ./gen-assets ..\..\256x256.png Assets

      - name: Download and stage the portable PostgreSQL distribution
        # Identical to #76's msix-postgres-elevation-poc — see that poc's own workflow comment
        # for why bin+share+lib must all be staged together with their relative layout preserved.
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $url = "https://get.enterprisedb.com/postgresql/postgresql-16.14-1-windows-x64-binaries.zip"
          Invoke-WebRequest -Uri $url -OutFile pg.zip
          Expand-Archive -Path pg.zip -DestinationPath pg_extracted -Force
          New-Item -ItemType Directory -Force -Path pgsql | Out-Null
          Move-Item -Path pg_extracted\pgsql\bin -Destination pgsql\bin
          Move-Item -Path pg_extracted\pgsql\share -Destination pgsql\share
          Move-Item -Path pg_extracted\pgsql\lib -Destination pgsql\lib
          Remove-Item -Recurse -Force pg_extracted, pg.zip
          Write-Host "Staged: $((Get-ChildItem -Recurse pgsql | Measure-Object -Property Length -Sum).Sum / 1MB) MB"

      - name: Bundle the VC++ Redistributable app-local (no system-wide install needed)
        # Identical to #76's poc — see that poc's own workflow comment for the full rationale
        # (Store-distributable apps can't run an elevated external installer at activation).
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vc_redist.x64.exe" -OutFile vc_redist.x64.exe
          Start-Process -FilePath .\vc_redist.x64.exe -ArgumentList "/install","/quiet","/norestart" -Wait
          Copy-Item C:\Windows\System32\vcruntime140.dll pgsql\bin\vcruntime140.dll
          Copy-Item C:\Windows\System32\vcruntime140_1.dll pgsql\bin\vcruntime140_1.dll
          Copy-Item C:\Windows\System32\msvcp140.dll pgsql\bin\msvcp140.dll
          Remove-Item vc_redist.x64.exe
          Write-Host "Bundled app-local VC++ runtime DLLs into pgsql\bin"

      - name: Bundle an embeddable Python + the real backend (source + requirements.txt)
        # Extends #76's poc pattern one step further: this is the first build to also stage the
        # REAL backend source (app/, alembic.ini, alembic/) alongside the embeddable interpreter,
        # not just its pip-installed dependencies - installer/launcher-native's backendAppDir
        # expects both to live in the same directory (see backend.go).
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -Uri "https://www.python.org/ftp/python/3.14.0/python-3.14.0-embed-amd64.zip" -OutFile python-embed.zip
          Expand-Archive -Path python-embed.zip -DestinationPath python -Force
          Remove-Item python-embed.zip

          $pthFile = Get-ChildItem python\python*._pth | Select-Object -First 1
          (Get-Content $pthFile.FullName) -replace '#import site', 'import site' | Set-Content $pthFile.FullName

          Invoke-WebRequest -Uri "https://bootstrap.pypa.io/get-pip.py" -OutFile get-pip.py
          & python\python.exe get-pip.py --no-warn-script-location
          Remove-Item get-pip.py

          & python\python.exe -m pip install --no-warn-script-location -r ..\..\..\backend\requirements.txt
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::pip install failed with exit code $LASTEXITCODE"
            exit 1
          }

          Copy-Item -Recurse ..\..\..\backend\app python\app
          Copy-Item ..\..\..\backend\alembic.ini python\alembic.ini
          Copy-Item -Recurse ..\..\..\backend\alembic python\alembic
          # __pycache__ directories from a local dev run of the backend would be stale/irrelevant
          # inside the package - not expected in a fresh checkout, but harmless to guard anyway.
          Get-ChildItem -Path python\app, python\alembic -Recurse -Directory -Filter "__pycache__" -ErrorAction SilentlyContinue |
            Remove-Item -Recurse -Force

          Write-Host "Bundled: $((Get-ChildItem -Recurse python | Measure-Object -Property Length -Sum).Sum / 1MB) MB"

      - name: Locate Windows SDK packaging/signing tools
        run: |
          $sdkRoot = "C:\Program Files (x86)\Windows Kits\10\bin"
          $sdkVer = Get-ChildItem $sdkRoot -Directory |
            Where-Object { $_.Name -match '^\d+\.\d+\.\d+\.\d+$' } |
            Sort-Object Name -Descending | Select-Object -First 1
          if (-not $sdkVer) {
            Write-Host "::error::No Windows 10 SDK bin directory found under $sdkRoot"
            exit 1
          }
          $makeappx = Join-Path $sdkVer.FullName "x64\makeappx.exe"
          $signtool = Join-Path $sdkVer.FullName "x64\signtool.exe"
          if (-not (Test-Path $makeappx)) {
            Write-Host "::error::makeappx.exe not found at $makeappx"
            exit 1
          }
          if (-not (Test-Path $signtool)) {
            Write-Host "::error::signtool.exe not found at $signtool"
            exit 1
          }
          Add-Content -Path $env:GITHUB_ENV -Value "MAKEAPPX=$makeappx"
          Add-Content -Path $env:GITHUB_ENV -Value "SIGNTOOL=$signtool"

      - name: Package MSIX
        run: |
          & $env:MAKEAPPX pack /d . /p poc.msix /o
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::makeappx pack failed with exit code $LASTEXITCODE"
            exit 1
          }

      - name: Generate ephemeral signing cert matching the real Publisher CN, sign, and trust it
        # The cert's Subject must match AppxManifest.xml's Identity/Publisher exactly - MSIX
        # signing validation requires this (Add-AppxPackage rejects a mismatch), it isn't just a
        # trust nicety. Still a fully throwaway, per-run cert though (same as PR #64's own
        # approach for this exact identity): local sideload trust doesn't check this CN against
        # a real Partner Center-issued certificate, only a real Store submission does. Trusting
        # it into LocalMachine\TrustedPeople + Root (mirrors #76's msix-postgres-elevation-poc)
        # is what lets Add-AppxPackage below install it without a "certificate not trusted" error.
        run: |
          $cert = New-SelfSignedCertificate -Type Custom -Subject "CN=2654AE3A-D473-41CE-8C17-0C2734C3B4A3" `
            -KeyUsage DigitalSignature -FriendlyName "PieManagerNativeLauncherPocCert" `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")
          $thumbprint = $cert.Thumbprint
          Add-Content -Path $env:GITHUB_ENV -Value "THUMBPRINT=$thumbprint"

          Export-Certificate -Cert $cert -FilePath cert.cer | Out-Null
          Import-Certificate -FilePath cert.cer -CertStoreLocation "Cert:\LocalMachine\TrustedPeople" | Out-Null
          Import-Certificate -FilePath cert.cer -CertStoreLocation "Cert:\LocalMachine\Root" | Out-Null

          & $env:SIGNTOOL sign /fd SHA256 /sha1 $thumbprint poc.msix
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::signtool sign failed with exit code $LASTEXITCODE"
            exit 1
          }

      - name: Upload signed package + cert (for real win11 VM testing)
        # windows-latest runs as Administrator with UAC disabled (GitHub's own documented
        # runner config) — not representative of a real personal PC, same reasoning as #76's
        # poc. The steps below prove the package installs and actually starts services on a
        # real Windows machine; the win11 VM remains the definitive test for anything
        # UAC/user-context-sensitive (there is none here — full-trust MSIX apps don't elevate).
        uses: actions/upload-artifact@v7.0.1
        with:
          name: native-launcher-poc
          path: |
            installer/testing/native-launcher-poc/poc.msix
            installer/testing/native-launcher-poc/cert.cer
          retention-days: 1

      - name: Install the package and launch it via its AUMID
        # Mirrors #76's msix-postgres-elevation-poc install/launch mechanism (Add-AppxPackage,
        # resolve AUMID from the installed package, Start-Process "shell:AppsFolder\<aumid>" -
        # the same route a real user takes double-clicking the Start Menu tile). Unlike that
        # poc's headless console exe, launcher-native.exe is a real WebView2 GUI app
        # (-H windowsgui) - this is the first real test of whether a WebView2 window can even
        # come up on a GitHub-hosted Windows runner, not just whether the backend starts.
        run: |
          try {
            Add-AppxPackage -Path poc.msix -Verbose
          } catch {
            Write-Host "::error::Add-AppxPackage failed: $_"
            exit 1
          }

          $pkg = Get-AppxPackage -Name "PIEManager.PIEManager"
          if (-not $pkg) {
            Write-Host "::error::Package not found after Add-AppxPackage"
            exit 1
          }
          $aumid = "$($pkg.PackageFamilyName)!App"
          Write-Host "Resolved AUMID: $aumid"

          Start-Process "shell:AppsFolder\$aumid"

      - name: Wait for the backend to become healthy, then dump logs
        # startupSequence's own healthTimeout only bounds waiting on uvicorn once it's spawned
        # (orchestrator.go) - this deadline is deliberately much larger, since it also covers
        # everything before that: MSIX activation, WebView2 startup, staging ~150+MB of
        # pgsql/python/frontend_dist out of the package's read-only install directory
        # (stageBundledFiles), initdb, pg_ctl start, createdb, and alembic migrations - all
        # first-run-only work a warm second launch wouldn't repeat.
        run: |
          $dataDir = Join-Path $env:USERPROFILE "PieManager"
          $logDir = Join-Path $dataDir "logs"
          $healthUrl = "http://127.0.0.1:14943/api/admin/version"

          $deadline = (Get-Date).AddSeconds(300)
          $healthy = $false
          while ((Get-Date) -lt $deadline) {
            try {
              $response = Invoke-WebRequest -Uri $healthUrl -UseBasicParsing -TimeoutSec 5
              if ($response.StatusCode -eq 200) { $healthy = $true; break }
            } catch {}
            Start-Sleep -Seconds 5
          }

          Write-Host "--- $dataDir contents ---"
          Get-ChildItem $dataDir -Recurse -ErrorAction SilentlyContinue | Format-List FullName, Length, LastWriteTime
          foreach ($log in @("initdb.log", "pgctl-start.log", "createdb.log", "alembic.log", "backend.log")) {
            $path = Join-Path $logDir $log
            if (Test-Path $path) {
              Write-Host "--- $log ---"
              Get-Content $path
            } else {
              Write-Host "--- $log : not written ---"
            }
          }

          if (-not $healthy) {
            Write-Host "::error::Backend never became healthy within the deadline"
            Write-Host "--- Is launcher-native.exe / postgres.exe / python.exe running? ---"
            Get-Process -Name launcher-native, postgres, python -ErrorAction SilentlyContinue | Format-List *
            exit 1
          }
          Write-Host "Health check passed"

      - name: Cleanup
        if: always()
        run: |
          Get-Process -Name launcher-native -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Get-Process -Name postgres -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Get-Process -Name python -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          $pkg = Get-AppxPackage -Name "PIEManager.PIEManager"
          if ($pkg) {
            Remove-AppxPackage -Package $pkg.PackageFullName -ErrorAction SilentlyContinue
          }
          if ($env:THUMBPRINT) {
            Remove-Item "Cert:\LocalMachine\Root\$env:THUMBPRINT" -ErrorAction SilentlyContinue
            Remove-Item "Cert:\LocalMachine\TrustedPeople\$env:THUMBPRINT" -ErrorAction SilentlyContinue
            Remove-Item "Cert:\CurrentUser\My\$env:THUMBPRINT" -ErrorAction SilentlyContinue
          }
