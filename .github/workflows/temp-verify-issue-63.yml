name: TEMP - verify issue #63 store launcher (delete after use)
# Throwaway verification workflow, deliberately separate from
# build-installer.yml -- never touches gh release create/upload/delete, so
# there is zero risk to the real release pipeline while testing on a branch.
# Deleted once the two things it checks are confirmed:
#   1. The new package-launcher-msix packaging steps actually produce a
#      valid, correctly-identified MSIX.
#   2. main_windows.go's new Store-first/local-fallback logic doesn't hang,
#      crash, or break the existing install flow (the Store listing isn't
#      published yet, so the expected outcome is a clean fallback to the
#      local launcher.exe -- identical end-user behavior to today).
on:
  push:
    branches:
      - 'feature/issue-63-store-launcher'
  workflow_dispatch:

jobs:
  determine-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Use the latest already-published release's version
        # So the real install below pulls real, already-existing Quay
        # images -- same reasoning as build-installer.yml's own
        # workflow_dispatch version resolution.
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST_TAG=$(gh release view --json tagName -q .tagName --repo "${{ github.repository }}")
          echo "version=${LATEST_TAG#v}" >> "$GITHUB_OUTPUT"

  package-launcher-msix:
    needs: determine-version
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: installer/launcher
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.22'

      - name: Build launcher.exe
        run: |
          $env:CGO_ENABLED = "0"
          go build -ldflags "-H windowsgui -s -w -X main.Version=${{ needs.determine-version.outputs.version }}" -o launcher.exe .

      - name: Generate Store logo assets from the app icon
        run: |
          New-Item -ItemType Directory -Force -Path Assets | Out-Null
          go run ./gen-assets pie-manager.ico Assets

      - name: Stage manifest with the real version
        run: |
          $version = "${{ needs.determine-version.outputs.version }}"
          (Get-Content AppxManifest.xml) -replace '__VERSION__', $version | Set-Content AppxManifest.xml

      - name: Locate Windows SDK packaging/signing tools
        run: |
          $sdkRoot = "C:\Program Files (x86)\Windows Kits\10\bin"
          $sdkVer = Get-ChildItem $sdkRoot -Directory |
            Where-Object { $_.Name -match '^\d+\.\d+\.\d+\.\d+$' } |
            Sort-Object Name -Descending | Select-Object -First 1
          if (-not $sdkVer) {
            Write-Host "::error::No Windows 10 SDK bin directory found under $sdkRoot"
            exit 1
          }
          $makeappx = Join-Path $sdkVer.FullName "x64\makeappx.exe"
          $signtool = Join-Path $sdkVer.FullName "x64\signtool.exe"
          Write-Host "Using makeappx: $makeappx"
          Write-Host "Using signtool: $signtool"
          Add-Content -Path $env:GITHUB_ENV -Value "MAKEAPPX=$makeappx"
          Add-Content -Path $env:GITHUB_ENV -Value "SIGNTOOL=$signtool"

      - name: Package MSIX
        run: |
          $version = "${{ needs.determine-version.outputs.version }}"
          & $env:MAKEAPPX pack /d . /p "pie-manager-launcher-$version.msix" /o
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::makeappx pack failed with exit code $LASTEXITCODE"
            exit 1
          }

      - name: Sign with an ephemeral cert matching the real Store Publisher CN
        run: |
          $version = "${{ needs.determine-version.outputs.version }}"
          $cert = New-SelfSignedCertificate -Type Custom -Subject "CN=2654AE3A-D473-41CE-8C17-0C2734C3B4A3" `
            -KeyUsage DigitalSignature -FriendlyName "PieManagerLauncherPackaging" `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")
          & $env:SIGNTOOL sign /fd SHA256 /sha1 $cert.Thumbprint "pie-manager-launcher-$version.msix"
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::signtool sign failed with exit code $LASTEXITCODE"
            exit 1
          }
          Remove-Item "Cert:\CurrentUser\My\$($cert.Thumbprint)" -ErrorAction SilentlyContinue

      - name: Validate the packaged manifest identity
        run: |
          $version = "${{ needs.determine-version.outputs.version }}"
          & $env:MAKEAPPX unpack /p "pie-manager-launcher-$version.msix" /d unpacked /o
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::makeappx unpack failed with exit code $LASTEXITCODE"
            exit 1
          }
          $manifest = Get-Content unpacked\AppxManifest.xml -Raw
          Write-Host $manifest
          if ($manifest -notmatch 'Name="PIEManager\.PIEManager"') {
            Write-Host "::error::Unexpected Identity/Name in packaged manifest"
            exit 1
          }
          if ($manifest -notmatch 'Publisher="CN=2654AE3A-D473-41CE-8C17-0C2734C3B4A3"') {
            Write-Host "::error::Unexpected Identity/Publisher in packaged manifest"
            exit 1
          }
          Write-Host "MSIX packaging verification PASSED."

  test-windows-install:
    needs: determine-version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Copy assets for embed
        shell: bash
        run: |
          mkdir -p installer/assets installer/launcher/assets
          cp compose-prod.yaml installer/assets/
          cp compose-prod.yaml installer/launcher/assets/
          cp packaging/pie-manager.desktop installer/assets/
          cp packaging/pie-manager.svg installer/assets/
          cp packaging/pie-manager-macos-info.plist installer/assets/

      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.22'

      - name: Build launcher.exe (embedded fallback copy)
        shell: bash
        run: |
          cd installer/launcher
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build \
            -ldflags="-H windowsgui -s -w -X main.Version=${{ needs.determine-version.outputs.version }}" \
            -o ../assets/launcher.exe .

      - name: Build pie-manager-windows-amd64.exe from this branch
        shell: bash
        run: |
          cd installer
          go mod tidy
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build \
            -ldflags="-s -w -X main.Version=${{ needs.determine-version.outputs.version }}" \
            -o pie-manager-windows-amd64.exe .

      - name: Wait for images to be published to Quay.io
        shell: pwsh
        run: |
          $version = "${{ needs.determine-version.outputs.version }}"
          foreach ($img in @('pie-manager-backend', 'pie-manager-frontend')) {
            $resp = Invoke-RestMethod -Uri "https://quay.io/api/v1/repository/ltourreau/${img}/tag/?specificTag=${version}&onlyActiveTags=true"
            if ($resp.tags.Count -eq 0) {
              Write-Host "::error::quay.io/ltourreau/${img}:${version} not found"
              exit 1
            }
            Write-Host "Found quay.io/ltourreau/${img}:${version}"
          }

      - name: Run real install (Scheduled Task, mirrors test-windows-install)
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $exe = (Resolve-Path ".\installer\pie-manager-windows-amd64.exe").Path
          $workDir = Split-Path $exe -Parent
          $taskName = "PieManagerInstallTest"
          $userId = "$env:COMPUTERNAME\$env:USERNAME"

          [Environment]::SetEnvironmentVariable('CI', 'true', 'Machine')

          $action = New-ScheduledTaskAction -Execute $exe -WorkingDirectory $workDir
          $principal = New-ScheduledTaskPrincipal -UserId $userId -LogonType Interactive -RunLevel Highest
          Register-ScheduledTask -TaskName $taskName -Action $action -Principal $principal -Force | Out-Null
          Start-ScheduledTask -TaskName $taskName

          $deadline = (Get-Date).AddMinutes(10)
          do {
            Start-Sleep -Seconds 5
            $state = (Get-ScheduledTask -TaskName $taskName).State
          } while ($state -ne 'Ready' -and (Get-Date) -lt $deadline)

          $info = Get-ScheduledTaskInfo -TaskName $taskName
          Write-Host "Task state: $state, last result: $($info.LastTaskResult)"
          Unregister-ScheduledTask -TaskName $taskName -Confirm:$false

          $logPath = Join-Path $workDir "install-prereq.log"
          if (Test-Path $logPath) {
            Write-Host "--- install-prereq.log ---"
            Get-Content $logPath
          }

          if ($state -ne 'Ready') {
            Write-Host "::error::Installer scheduled task did not finish within 10 minutes"
            exit 1
          }
          if ($info.LastTaskResult -ne 0) {
            Write-Host "::error::Installer exited with code $($info.LastTaskResult)"
            exit 1
          }

      - name: Verify the app is actually serving traffic
        shell: pwsh
        run: |
          for ($i = 0; $i -lt 60; $i++) {
            try {
              $response = Invoke-WebRequest -Uri "http://localhost:14943/api/admin/health" -UseBasicParsing -TimeoutSec 5
              if ($response.StatusCode -eq 200) {
                Write-Host "Health check passed"
                exit 0
              }
            } catch {}
            Start-Sleep -Seconds 5
          }
          Write-Host "::error::Windows install: health check never succeeded"
          exit 1

      - name: Confirm the new Store-first/local-fallback logic actually ran
        shell: pwsh
        run: |
          $logPath = "installer\install-prereq.log"
          $content = Get-Content $logPath -Raw
          if ($content -notmatch 'CI run . skipping interactive Store install wait') {
            Write-Host "::error::Expected CI fallback log line not found -- ensureStoreLauncherInstalled may not have run as expected"
            exit 1
          }
          if ($content -notmatch 'launcher\.exe deployed to') {
            Write-Host "::error::Local fallback launcher.exe deployment log line not found"
            exit 1
          }
          Write-Host "Hybrid fallback verification PASSED: Store path skipped under CI, local launcher.exe deployed, app served traffic."
