name: PgQueuer Windows-native POC (issue #66 step 1)

# Manual-only: this is a one-shot viability check, not a permanent release gate. It
# deliberately does NOT use WSL2/Podman/containers at all — the existing test-windows-install
# job (build-installer.yml) already proves Celery+Redis work fine in that containerized path,
# so repeating that here would show nothing new. The actual open question (relevant to both
# #66's PgQueuer viability and #65's native-Windows-port direction) is whether PgQueuer runs
# as a plain native Windows process against a plain native Windows PostgreSQL — no containers.
on:
  workflow_dispatch:

jobs:
  windows-native-pgqueuer-poc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install PostgreSQL natively (no Docker, no WSL2, no Podman)
        shell: pwsh
        run: |
          choco install postgresql16 --params '/Password:pie_password' --force -y
          echo "C:\Program Files\PostgreSQL\16\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Create pie role and database
        shell: pwsh
        env:
          PGPASSWORD: pie_password
        run: |
          psql -U postgres -h localhost -c "CREATE USER pie WITH PASSWORD 'pie_password' SUPERUSER;"
          psql -U postgres -h localhost -c "CREATE DATABASE pie_db OWNER pie;"

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14'

      - name: Install backend dependencies
        shell: pwsh
        run: pip install -r backend/requirements.txt

      - name: Run Alembic migrations natively on Windows (creates job_runs + pgqueuer's own schema)
        shell: pwsh
        env:
          DATABASE_URL: postgresql+asyncpg://pie:pie_password@localhost:5432/pie_db
        working-directory: backend
        run: python -m alembic upgrade head

      - name: Run pgq as a plain native Windows process (no containers) for 10s
        shell: pwsh
        env:
          DATABASE_URL: postgresql+asyncpg://pie:pie_password@localhost:5432/pie_db
          PYTHONPATH: ${{ github.workspace }}\backend
        working-directory: backend
        run: |
          $proc = Start-Process -FilePath "pgq" `
            -ArgumentList "run", "app.tasks.pgq_app:main", "--log-level=INFO" `
            -PassThru -RedirectStandardOutput "..\pgq_stdout.log" -RedirectStandardError "..\pgq_stderr.log"
          Start-Sleep -Seconds 10
          if (-not $proc.HasExited) {
            Stop-Process -Id $proc.Id -Force
            Write-Host "pgq process stopped after running cleanly for 10s."
          } else {
            Write-Host "pgq process exited on its own (exit code $($proc.ExitCode)) — see logs."
          }

      - name: Show pgq stdout/stderr
        if: always()
        shell: pwsh
        run: |
          Write-Host "--- stdout ---"
          Get-Content pgq_stdout.log -ErrorAction SilentlyContinue
          Write-Host "--- stderr ---"
          Get-Content pgq_stderr.log -ErrorAction SilentlyContinue

      - name: Verify all 6 schedules registered with sane next_run values
        shell: pwsh
        env:
          PGPASSWORD: pie_password
        run: |
          $count = (psql -U pie -h localhost -d pie_db -t -c "SELECT count(*) FROM pgqueuer_schedules;").Trim()
          Write-Host "Registered schedules: $count"
          psql -U pie -h localhost -d pie_db -c "SELECT entrypoint, expression, next_run, status FROM pgqueuer_schedules ORDER BY entrypoint;"
          if ($count -ne "6") {
            throw "Expected 6 registered schedules, got $count"
          }

      - name: Verify job_runs table exists (dual-write foundation)
        shell: pwsh
        env:
          PGPASSWORD: pie_password
        run: |
          psql -U pie -h localhost -d pie_db -c "\d job_runs"
