<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Background rounded square -->
  <rect width="256" height="256" rx="48" ry="48" fill="#1a2744"/>

  <!-- Grid lines (subtle) -->
  <line x1="40" y1="80"  x2="216" y2="80"  stroke="#2a3a5c" stroke-width="1.5"/>
  <line x1="40" y1="120" x2="216" y2="120" stroke="#2a3a5c" stroke-width="1.5"/>
  <line x1="40" y1="160" x2="216" y2="160" stroke="#2a3a5c" stroke-width="1.5"/>

  <!-- Bar chart (background bars, muted) -->
  <rect x="52"  y="150" width="26" height="46" rx="4" fill="#2a4a7a" opacity="0.7"/>
  <rect x="94"  y="128" width="26" height="68" rx="4" fill="#2a4a7a" opacity="0.7"/>
  <rect x="136" y="108" width="26" height="88" rx="4" fill="#2a4a7a" opacity="0.7"/>
  <rect x="178" y="80"  width="26" height="116" rx="4" fill="#2a4a7a" opacity="0.7"/>

  <!-- Performance line (the main element) -->
  <polyline
    points="52,168  94,145  136,118  178,88"
    fill="none"
    stroke="#00d4aa"
    stroke-width="6"
    stroke-linecap="round"
    stroke-linejoin="round"/>

  <!-- Dots on the line -->
  <circle cx="52"  cy="168" r="7" fill="#00d4aa"/>
  <circle cx="94"  cy="145" r="7" fill="#00d4aa"/>
  <circle cx="136" cy="118" r="7" fill="#00d4aa"/>
  <circle cx="178" cy="88"  r="9" fill="#00d4aa" stroke="#ffffff" stroke-width="2.5"/>

  <!-- Arrow up on last point -->
  <polyline
    points="178,72  178,58"
    stroke="#00d4aa"
    stroke-width="5"
    stroke-linecap="round"/>
  <polygon points="178,48  170,66  186,66" fill="#00d4aa"/>

  <!-- "€" symbol bottom left -->
  <text x="44" y="230" font-family="sans-serif" font-weight="bold" font-size="32" fill="#4a9eff" opacity="0.9">€</text>

  <!-- "PIE" text bottom right -->
  <text x="88" y="230" font-family="sans-serif" font-weight="bold" font-size="28" fill="#ffffff" opacity="0.85">PIE</text>
</svg>
