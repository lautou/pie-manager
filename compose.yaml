# Explicit project name: without it, podman-compose/docker-compose derive the project name
# from this directory's basename ("pie-manager"), which collides with the production
# install's own compose-prod.yaml (deployed under a directory sharing that same basename) —
# see compose-prod.yaml's matching `name:` key and .claude/rules/containers-and-backup.md.
name: pie-manager-dev

services:
  postgres:
    image: docker.io/library/postgres:18-alpine@sha256:63bdc97d67b5133bf0e5ebd500bec6d046fa851dc81340d838f0347e616107e8
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pie}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pie_password}
      POSTGRES_DB: ${POSTGRES_DB:-pie_db}
      # PostgreSQL 18's official image defaults PGDATA to a version-scoped subdirectory
      # under a new /var/lib/postgresql VOLUME (issue #58) — pinning it back to the pre-18
      # single-directory convention avoids restructuring every existing data volume.
      # Verified empirically: postgres:18-alpine starts cleanly on a fresh volume mounted
      # exactly like this, and a real dump/restore round-trip preserved all data.
      PGDATA: /var/lib/postgresql/data
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pie} -d ${POSTGRES_DB:-pie_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Containerfile
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      PYTHONPATH: /app
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app:z
    depends_on:
      - postgres
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  pgq-worker:
    build:
      context: ./backend
      dockerfile: Containerfile
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      PYTHONPATH: /app
    volumes:
      - ./backend:/app:z
    depends_on:
      - backend
    command: pgq run app.tasks.pgq_app:main

  frontend:
    build:
      context: ./frontend
      dockerfile: Containerfile
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app:z
      - frontend_node_modules:/app/node_modules
    environment:
      VITE_API_URL: http://localhost:8000
      VITE_BACKEND_URL: http://backend:8000
    depends_on:
      - backend
    command: node_modules/.bin/vite --host 0.0.0.0

volumes:
  postgres_data:
  frontend_node_modules:
