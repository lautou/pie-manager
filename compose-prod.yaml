# compose-prod.yaml — Production deployment using pre-built images from Quay.io
# Used by the pie-manager installer binary.

services:
  postgres:
    restart: unless-stopped
    image: docker.io/library/postgres:18-alpine@sha256:63bdc97d67b5133bf0e5ebd500bec6d046fa851dc81340d838f0347e616107e8
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pie}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pie_password}
      POSTGRES_DB: ${POSTGRES_DB:-pie_db}
      # PostgreSQL 18's official image defaults PGDATA to a version-scoped subdirectory
      # under a new /var/lib/postgresql VOLUME (issue #58) — pinning it back to the pre-18
      # single-directory convention avoids restructuring every existing data volume.
      # Verified empirically: postgres:18-alpine starts cleanly on a fresh volume mounted
      # exactly like this, and a real dump/restore round-trip preserved all data.
      PGDATA: /var/lib/postgresql/data
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pie} -d ${POSTGRES_DB:-pie_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    restart: unless-stopped
    image: quay.io/ltourreau/pie-manager-backend:${APP_VERSION:-latest}
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-pie}:${POSTGRES_PASSWORD:-pie_password}@postgres:5432/pie_db
      PYTHONPATH: /app
      DEBUG: "false"
      APP_VERSION: ${APP_VERSION:-dev}
      INSTALLER_VERSION: ${INSTALLER_VERSION:-UNKNOWN}
    depends_on:
      - postgres
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  pgq-worker:
    restart: unless-stopped
    image: quay.io/ltourreau/pie-manager-backend:${APP_VERSION:-latest}
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-pie}:${POSTGRES_PASSWORD:-pie_password}@postgres:5432/pie_db
      PYTHONPATH: /app
    depends_on:
      - backend
    command: pgq run app.tasks.pgq_app:main

  frontend:
    restart: unless-stopped
    image: quay.io/ltourreau/pie-manager-frontend:${APP_VERSION:-latest}
    depends_on:
      - backend

  haproxy:
    restart: unless-stopped
    image: docker.io/library/haproxy:alpine@sha256:fb87fc81943143b9acaea7442973e6ba654035fff76ffe7af6829dd1bcb0f7a5
    ports:
      - "${APP_PORT:-14943}:8080"
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro,z
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:
